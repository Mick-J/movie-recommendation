services:
  kafka1:
    image: apache/kafka:4.3.1
    container_name: kafka1
    working_dir: /opt/kafka/bin/
    env_file:
      - .env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:SASL_SSL
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:8081
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:8081
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      # SASL - PLAIN: Username / Password
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      # SSL
      KAFKA_SSL_KEYSTORE_LOCATION: /sasl_ssl/certs/kafka1.keystore.jks

      # jaas config
      KAFKA_OPTS: "-Djava.security.auth.login.config=/opt/kafka/config/jaas.conf"
    ports:
      - 8081:8081
    volumes:
      - ./sasl_ssl/conf/jaas.conf:/opt/kafka/config/jaas.conf:ro
      - ./sasl_ssl/certs/kafka1.keystore.jks:/sasl_ssl/certs/kafka1.keystore.jks:ro
      - ./sasl_ssl/certs/kafka.truststore.jks:/sasl_ssl/certs/kafka.truststore.jks:ro
    networks:
      - kafka-net

  kafka2:
